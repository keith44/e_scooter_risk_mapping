<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Denver E-Scooter Map</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>


    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>

<body>
    <header>
        <h1>Denver E-Scooter Risk Dashboard</h1>
        <p>Starter webpage with a map</p>
    </header>

    <div class="container mt-3">



        <div id="map-container">
            <p class="heatmap-title">

                Denver E-Scooter Map
            </p>
            <div class="row g-2 align-items-left justify-content-center">

                <div class="col-auto">
                    <label for="yearFilter" class="form-label mb-1">Year</label>
                    <select id="yearFilter" class="form-select form-select-sm">
                        <option value="all">All</option>
                        <option value="2020">2020</option>
                        <option value="2021">2021</option>
                        <option value="2022">2022</option>
                        <option value="2023">2023</option>
                        <option value="2024">2024</option>

                    </select>
                </div>

                <div class="col-auto">
                    <label for="quarterFilter" class="form-label mb-1">Quarter</label>
                    <select id="quarterFilter" class="form-select form-select-sm">
                        <option value="all">All</option>
                        <option value="Q1">Q1</option>
                        <option value="Q2">Q2</option>
                        <option value="Q3">Q3</option>
                        <option value="Q4">Q4</option>
                    </select>
                </div>
            </div>

                <div id="visible-usage-total">

                    asdfa
                </div>

            <div id="map">
                <div id="legend" class="card p-2 shadow-sm">
                    <div class="small fw-bold mb-1">Usage Count</div>

                    <div id="legend-gradient"></div>

                    <div class="d-flex justify-content-between small">
                        <span id="legend-min"></span>
                        <span id="legend-max"></span>
                    </div>
                </div>
            </div>
        </div>









        <select id="selectButton"></select>
        <div id="crash-heatmap-container">

            <p class="heatmap-title">

                Frequency of Crashes by Day of Week
            </p>
            <div id="crash-heatmap"></div>
        </div>

        <div id="crash-timeseries-container">
            <p class="timeseries-title">
                Number of Crashes over time </p>
            <div id="crash-timeseries"></div>
        </div>
    </div>


</body>

</html>
